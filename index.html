<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文发音大闯关</title>
<style>
*{box-sizing:border-box}
:root{font-family:Inter,Arial,"Microsoft YaHei",sans-serif;color:#172033;background:#f4f6fb}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#e9e5ff 0,#f4f6fb 35%,#eef7ff 100%)}
button{font:inherit}
.app{width:min(900px,calc(100% - 28px));margin:0 auto;padding:28px 0 40px}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-weight:950;font-size:26px}.sub{color:#667085;font-size:14px;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:8px 13px;font-weight:800;font-size:14px}
.track{height:9px;background:#e2e5ec;border-radius:99px;overflow:hidden;margin:18px 0}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#635bff,#a855f7);transition:width .35s}
.panel{background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:28px;box-shadow:0 18px 60px #27314d14;padding:34px;text-align:center}
.startIcon{font-size:70px}.title{font-size:32px;font-weight:950;margin:8px 0}.desc{color:#667085;line-height:1.6}
.primary{border:0;border-radius:16px;background:linear-gradient(135deg,#5b55f6,#7c3aed);color:#fff;font-weight:900;padding:15px 26px;cursor:pointer;box-shadow:0 10px 25px #635bff33}
.primary:active{transform:translateY(1px)}
.hidden{display:none!important}
.level{font-size:13px;color:#667085;font-weight:850;letter-spacing:.08em}
.stage{position:relative;min-height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual{font-size:150px;filter:drop-shadow(0 18px 18px #11182718);user-select:none;transition:transform .25s}
.visual.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.75) rotate(-6deg);opacity:.4}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1)}}
.correct{animation:correct .7s ease}
@keyframes correct{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(5deg)}100%{transform:scale(.2);opacity:0}}
.spark{position:absolute;font-size:34px;opacity:0;pointer-events:none}
.spark.go{animation:spark .7s ease}
@keyframes spark{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}
.mic{width:112px;height:112px;border:0;border-radius:50%;background:#5b55f6;color:#fff;font-size:46px;cursor:pointer;box-shadow:0 13px 35px #635bff3d}
.mic.listening{animation:micpulse 1.05s infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 18px #635bff18,0 13px 35px #635bff3d;transform:scale(1.05)}}
.status{min-height:30px;margin:13px 0 5px;font-size:18px;font-weight:900}
.heard{min-height:24px;color:#667085;font-size:14px}
.wordReveal{margin-top:14px;min-height:65px}.word{font-size:32px;font-weight:950}.pinyin{color:#667085;font-size:18px}
.tip{font-size:12px;color:#98a2b3;margin-top:15px}
.finishScore{font-size:64px;font-weight:950;background:linear-gradient(135deg,#5b55f6,#a855f7);color:transparent;background-clip:text}
.error{color:#b42318;font-weight:750}
.good{color:#087443}
@media(max-width:600px){.app{padding-top:18px}.panel{padding:22px}.stage{min-height:300px}.visual{font-size:115px}.mic{width:94px;height:94px;font-size:38px}.title{font-size:27px}}
</style>
</head>
<body>
<main class="app">
<header class="header">
  <div><div class="brand">🎤 中文发音大闯关</div><div class="sub">看图 → 说中文 → 自动识别 → 自动过关</div></div>
  <div class="stats"><span class="pill">⭐ <b id="score">0</b></span><span class="pill">🔥 <b id="combo">0</b></span><span class="pill">❤️ <b id="lives">3</b></span></div>
</header>
<div class="track"><i id="progress"></i></div>

<section class="panel" id="start">
  <div class="startIcon">🎧🇨🇳</div>
  <div class="title">准备好了吗？</div>
  <p class="desc">允许麦克风后，网页会持续听你说中文。<br><b>说对以后，不需要点击任何按钮，下一张图片会自动出现。识别没听清时可以直接再说一次。</b></p>
  <button class="primary" id="startBtn">🎤 开始游戏</button>
  <p class="tip">推荐使用最新版 Google Chrome，并允许此网站使用麦克风。</p>
</section>

<section class="panel hidden" id="game">
  <div class="level" id="level"></div>
  <div class="stage">
    <div class="visual" id="visual"></div>
    <span class="spark" id="s1">✨</span><span class="spark" id="s2">⭐</span><span class="spark" id="s3">🎉</span>
  </div>
  <div class="prompt" id="prompt">说出这个东西的中文名称</div>
  <div class="wordReveal hidden" id="reveal"><div class="word" id="word"></div><div class="pinyin" id="pinyin"></div></div>
  <button class="mic" id="mic" aria-label="麦克风">🎤</button>
  <div class="status" id="status">正在准备麦克风…</div>
  <div class="heard" id="heard"></div>
  <div class="tip">说对后自动进入下一关 · 不需要点击 Next</div>
</section>

<section class="panel hidden" id="finish">
  <div class="startIcon">🏆</div>
  <div class="title">闯关完成！</div>
  <div class="finishScore" id="finalScore">0</div>
  <p id="finalMsg" class="desc"></p>
  <button class="primary" id="again">🔄 再玩一次</button>
</section>
</main>

<script>
(() => {
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  const levels = [
    {pic:"🍌",word:"香蕉",pinyin:"xiāng jiāo"},
    {pic:"🍎",word:"苹果",pinyin:"píng guǒ"},
    {pic:"🍓",word:"草莓",pinyin:"cǎo méi"},
    {pic:"🍉",word:"西瓜",pinyin:"xī guā"},
    {pic:"🐱",word:"猫",pinyin:"māo"},
    {pic:"🐶",word:"狗",pinyin:"gǒu"},
    {pic:"🐰",word:"兔子",pinyin:"tù zi"},
    {pic:"🥟",word:"饺子",pinyin:"jiǎo zi"},
    {pic:"🍜",word:"面条",pinyin:"miàn tiáo"},
    {pic:"🍚",word:"米饭",pinyin:"mǐ fàn"},
    {pic:"🧋",word:"奶茶",pinyin:"nǎi chá"},
    {pic:"🏫",word:"学校",pinyin:"xué xiào"}
  ];
  const $ = id => document.getElementById(id);
  let recognition=null, stream=null, idx=0, score=0, combo=0, lives=3, locked=false, listening=false, finishing=false;

  function norm(s){return String(s||"").replace(/[\s，。！？、,.!?]/g,"").trim();}
  function stats(){ $("score").textContent=score; $("combo").textContent=combo; $("lives").textContent=lives; }
  function render(){
    locked=false;
    const q=levels[idx];
    $("level").textContent=`LEVEL ${idx+1} / ${levels.length}`;
    $("visual").textContent=q.pic;
    $("visual").classList.remove("pop","correct");
    void $("visual").offsetWidth; $("visual").classList.add("pop");
    $("progress").style.width=`${idx/levels.length*100}%`;
    $("prompt").textContent="说出这个东西的中文名称";
    $("reveal").classList.add("hidden");
    $("heard").textContent="";
    $("status").textContent="🎧 正在听…";
    $("status").className="status";
  }
  async function getMic(){
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("MIC_UNSUPPORTED");
    if(!stream) stream=await navigator.mediaDevices.getUserMedia({audio:true});
  }
  function setup(){
    recognition=new Speech();
    recognition.lang="zh-CN";
    recognition.continuous=true;
    recognition.interimResults=true;
    recognition.maxAlternatives=5;
    recognition.onstart=()=>{listening=true;$("mic").classList.add("listening");$("status").textContent="🎧 正在听…";};
    recognition.onresult=e=>{
      let interim="", finals=[];
      for(let n=e.resultIndex;n<e.results.length;n++){
        const r=e.results[n];
        const t=r[0]?.transcript||"";
        if(r.isFinal){
          const choices=[];
          for(let k=0;k<Math.min(r.length,5);k++) choices.push(r[k]?.transcript||"");
          finals.push(...choices);
        } else interim+=t;
      }
      const shown=(finals[0]||interim).trim();
      if(shown) $("heard").textContent="识别到："+shown;
      if(finals.length && !locked) check(finals);
    };
    recognition.onerror=e=>{
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){
        $("status").textContent="⚠️ 麦克风权限被拒绝，请在浏览器设置中允许此网站使用麦克风。";
        $("status").className="status error";
      }else if(e.error!=="no-speech"&&e.error!=="aborted"){
        $("status").textContent="没有听清，再说一次。";
      }
    };
    recognition.onend=()=>{
      listening=false;$("mic").classList.remove("listening");
      if(!locked&&!finishing) setTimeout(startListening,180);
    };
  }
  function startListening(){
    if(!recognition||listening||locked||finishing)return;
    try{recognition.start();}catch(e){}
  }
  function celebrate(){
    ["s1","s2","s3"].forEach((id,n)=>{
      const el=$(id);el.style.setProperty("--x",`${n===0?-90:n===1?0:90}px`);el.style.setProperty("--y",`${n===1?-90:-55}px`);
      el.classList.remove("go");void el.offsetWidth;el.classList.add("go");
    });
  }
  function check(candidates){
    const q=levels[idx];
    const target=norm(q.word);
    const aliases={
      "香蕉":["香蕉","香焦","香蕉儿","香蕉的"],
      "苹果":["苹果","平果","苹果的"],
      "草莓":["草莓","草梅","草莓的"],
      "西瓜":["西瓜","西瓜的"],
      "猫":["猫","猫咪","小猫"],
      "狗":["狗","小狗","狗狗"],
      "兔子":["兔子","兔","兔子的"],
      "饺子":["饺子","饺","饺子的"],
      "面条":["面条","面","面条的"],
      "米饭":["米饭","米饭的","米"],
      "奶茶":["奶茶","奶茶的"],
      "学校":["学校","学校的"]
    };
    const accepted=(aliases[q.word]||[q.word]).map(norm);
    const list=(Array.isArray(candidates)?candidates:[candidates]).map(norm).filter(Boolean);
    const correct=list.some(heard=>accepted.some(a=>heard===a||heard.includes(a)));
    if(correct){
      locked=true;combo++;score+=100+Math.min(combo-1,10)*25;stats();celebrate();
      $("reveal").classList.remove("hidden");$("word").textContent=q.word;$("pinyin").textContent=q.pinyin;
      $("status").textContent="✅ 正确！";$("status").className="status good";
      $("visual").classList.add("correct");
      setTimeout(()=>{
        idx++;
        if(idx>=levels.length) finish();
        else {render();startListening();}
      },650);
    }else{
      // Do not immediately consume a life for every imperfect ASR result.
      // The learner can simply try again.
      $("status").textContent="👂 没听清，再说一次！";$("status").className="status error";
    }
  }
  function finish(){
    finishing=true;
    try{recognition?.stop();}catch(e){}
    $("game").classList.add("hidden");$("finish").classList.remove("hidden");$("progress").style.width="100%";
    $("finalScore").textContent=score;
    $("finalMsg").textContent=idx>=levels.length?"🌟 太厉害了！你完成了全部中文发音挑战！":"💪 很不错！再玩一次，挑战更高分！";
  }
  async function begin(){
    if(!Speech){alert("请使用最新版 Google Chrome。此浏览器不支持网页语音识别。");return;}
    try{
      await getMic();
      idx=0;score=0;combo=0;lives=3;finishing=false;stats();
      $("start").classList.add("hidden");$("finish").classList.add("hidden");$("game").classList.remove("hidden");
      setup();render();startListening();
    }catch(e){
      alert("需要允许麦克风权限才能开始游戏。请点击浏览器地址栏左侧的麦克风/权限图标，选择 Allow，然后重新开始。");
    }
  }
  $("startBtn").addEventListener("click",begin);
  $("again").addEventListener("click",begin);
  $("mic").addEventListener("click",()=>{if(listening){try{recognition.stop();}catch(e){}}else startListening();});
  stats();
})();
</script>
</body>
</html>
